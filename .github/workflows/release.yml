name: release

# Build the sdist + wheel and publish to PyPI via OIDC Trusted Publishing.
#
# One-time PyPI setup (no API token needed):
#   1. https://pypi.org/manage/account/publishing/
#   2. Add a pending publisher:
#        PyPI project name: stem-separator
#        Owner:             Su1ph3r
#        Repository:        stem-separator
#        Workflow name:     release.yml
#        Environment:       pypi
#   3. Tag + push to publish:  git tag v2.0.0 && git push origin v2.0.0
#
# PyPI is irreversible — a version, once uploaded, can never be replaced.
# The publish job runs only after build succeeds and twine check passes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build "twine>=6.0" "pkginfo>=1.12"
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # The `pypi` environment must match the one set on the PyPI publisher.
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
